name: Deploy approved staging preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_PUBLIC_BOOKING_URL: ${{ vars.BOOKING_URL }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm audit --audit-level=high
      - name: Require explicit staging configuration
        run: node scripts/check-staging.mjs
      - run: npm run build:worker
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx opennextjs-cloudflare deploy
      - name: Remote smoke checks
        run: node scripts/smoke.mjs
